<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WhatsApp Atak | Group & Channel Blocker</title>
  <!-- Font Awesome 6 (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none; /* slight "hacker" feel, but text can still be selected if needed */
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
      font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* Main glassmorphism card */
    .atak-container {
      max-width: 1300px;
      width: 100%;
      background: rgba(12, 20, 30, 0.65);
      backdrop-filter: blur(14px);
      border-radius: 3rem;
      border: 1px solid rgba(0, 255, 170, 0.25);
      box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 0 1px rgba(0, 255, 170, 0.1) inset;
      padding: 2rem 2rem 2.5rem;
      transition: all 0.3s ease;
    }

    /* Header area with intense style */
    .header {
      text-align: center;
      margin-bottom: 2.2rem;
      border-bottom: 2px dashed rgba(0, 255, 200, 0.4);
      padding-bottom: 1rem;
    }

    .header h1 {
      font-size: 2.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFFFFF, #2affb6, #00c3ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      text-shadow: 0 0 8px rgba(0,255,170,0.3);
    }

    .header .sub {
      color: #bbf0e6;
      font-weight: 500;
      background: rgba(0,0,0,0.4);
      display: inline-block;
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
      margin-top: 8px;
    }

    /* two column layout */
    .attack-panels {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .panel {
      flex: 1;
      min-width: 280px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      padding: 1.6rem 1.4rem;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .panel:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 255, 170, 0.5);
      box-shadow: 0 20px 30px -12px rgba(0,0,0,0.6);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1.4rem;
      border-left: 5px solid;
      padding-left: 16px;
    }

    .group-panel .panel-title {
      border-left-color: #ff4757;
      color: #ff7b89;
    }
    .channel-panel .panel-title {
      border-left-color: #ffb347;
      color: #ffae42;
    }

    .panel-title i {
      font-size: 2rem;
    }

    .input-group {
      margin-bottom: 1.3rem;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: #b9f6e6;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      background: rgba(20, 30, 45, 0.9);
      border: 1px solid #2c3e4e;
      padding: 12px 15px;
      border-radius: 28px;
      font-size: 0.95rem;
      color: #eef5ff;
      font-weight: 500;
      transition: all 0.2s;
      outline: none;
    }

    .input-group input:focus {
      border-color: #2affb6;
      box-shadow: 0 0 8px rgba(42,255,182,0.4);
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(95deg, #1f2a3e, #0f1722);
      border: none;
      padding: 12px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 1rem;
      color: #e2f0fa;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .group-panel .action-btn.primary {
      background: linear-gradient(95deg, #d32f2f, #b71c1c);
      box-shadow: 0 0 12px rgba(211,47,47,0.3);
    }
    .channel-panel .action-btn.primary {
      background: linear-gradient(95deg, #f57c00, #e65100);
      box-shadow: 0 0 12px rgba(245,124,0,0.3);
    }

    .action-btn.primary:hover {
      filter: brightness(1.1);
      transform: scale(0.98);
      box-shadow: 0 0 16px currentColor;
    }

    .reset-btn {
      background: rgba(50,60,80,0.7);
      border: 1px solid #4e6e7e;
    }
    .reset-btn:hover {
      background: #2c3e55;
    }

    /* list styles for attacked items */
    .attacked-list {
      margin-top: 1.5rem;
      background: rgba(0,0,0,0.35);
      border-radius: 1.2rem;
      padding: 0.8rem;
    }

    .attacked-list h4 {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #8aaec0;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px dashed #2c4b5a;
      padding-bottom: 6px;
    }

    .list-items {
      max-height: 180px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .item-badge {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 40px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid;
      word-break: break-all;
    }

    .group-item {
      border-left-color: #ff4757;
    }
    .channel-item {
      border-left-color: #ffb347;
    }

    .item-text {
      font-family: monospace;
      font-weight: 500;
      color: #eef;
    }

    .remove-single {
      background: none;
      border: none;
      color: #ff8a7a;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.1s;
      padding: 0 6px;
    }
    .remove-single:hover {
      color: white;
      text-shadow: 0 0 3px red;
    }

    /* attack stats & footer */
    .stats-area {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.9rem 1.5rem;
      border-radius: 60px;
      margin-top: 1rem;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .stat-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 18px;
      border-radius: 32px;
    }

    .stat-card i {
      font-size: 1.2rem;
    }

    .global-reset {
      background: #2a2f3f;
      border: 1px solid #ff6b6b70;
    }

    .global-reset:hover {
      background: #3a2f3f;
      border-color: #ff8a7a;
    }

    footer {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.7rem;
      color: #6d8f9f;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0a141f;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #2affb6;
      border-radius: 10px;
    }

    @media (max-width: 780px) {
      .atak-container {
        padding: 1.5rem;
      }
      .header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

<div class="atak-container">
  <div class="header">
    <h1><i class="fas fa-skull-crossbones"></i> WHATSAPP ATAK <i class="fas fa-bolt"></i></h1>
    <div class="sub">⚡ END GROUPS & BAN CHANNELS ⚡ #OperationBlackout</div>
  </div>

  <div class="attack-panels">
    <!-- GROUP PANEL - End WhatsApp Group -->
    <div class="panel group-panel">
      <div class="panel-title">
        <i class="fab fa-whatsapp" style="color: #25D366;"></i>
        <span>GROUP END</span>
        <i class="fas fa-users-slash"></i>
      </div>
      <div class="input-group">
        <label><i class="fas fa-link"></i> WhatsApp Group Invite Link or Group JID</label>
        <input type="text" id="groupInput" placeholder="https://chat.whatsapp.com/AbCdEfG or gJID_example" autocomplete="off">
      </div>
      <button class="action-btn primary" id="endGroupBtn">
        <i class="fas fa-bomb"></i> END GROUP / DESTROY
      </button>
      <button class="action-btn reset-btn" id="resetGroupsBtn">
        <i class="fas fa-trash-restore"></i> CLEAR ENDED GROUPS
      </button>
      <div class="attacked-list">
        <h4><i class="fas fa-skull"></i> TERMINATED GROUPS</h4>
        <div id="groupListContainer" class="list-items">
          <!-- dynamic group items appear here -->
          <div class="empty-msg" style="color:#5c7f8c;text-align:center;padding:8px;">No groups ended yet.</div>
        </div>
      </div>
    </div>

    <!-- CHANNEL PANEL - Ban WhatsApp Channel -->
    <div class="panel channel-panel">
      <div class="panel-title">
        <i class="fab fa-whatsapp" style="color: #25D366;"></i>
        <span>CHANNEL BAN</span>
        <i class="fas fa-ban"></i>
      </div>
      <div class="input-group">
        <label><i class="fas fa-hashtag"></i> WhatsApp Channel ID / @channel</label>
        <input type="text" id="channelInput" placeholder="channel_id_12345 or https://whatsapp.com/channel/..." autocomplete="off">
      </div>
      <button class="action-btn primary" id="banChannelBtn">
        <i class="fas fa-gavel"></i> BAN CHANNEL
      </button>
      <button class="action-btn reset-btn" id="resetChannelsBtn">
        <i class="fas fa-broom"></i> CLEAR BANNED CHANNELS
      </button>
      <div class="attacked-list">
        <h4><i class="fas fa-lock"></i> BANNED CHANNELS</h4>
        <div id="channelListContainer" class="list-items">
          <div class="empty-msg" style="color:#5c7f8c;text-align:center;padding:8px;">No channels banned yet.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats & Full Reset Area -->
  <div class="stats-area">
    <div class="stat-card"><i class="fas fa-users-slash" style="color:#ff7b89;"></i> <span id="groupCount">0</span> Groups Ended</div>
    <div class="stat-card"><i class="fas fa-times-circle" style="color:#ffae42;"></i> <span id="channelCount">0</span> Channels Banned</div>
    <button class="action-btn global-reset" id="fullResetBtn">
      <i class="fas fa-radiation"></i> FULL ATAK RESET
    </button>
  </div>
  <footer>
    <i class="fas fa-shield-haltered"></i> tactical interface • simulated takedown • whatsapp countermeasure panel
  </footer>
</div>

<script>
  // --- LOCAL STORAGE KEYS ---
  const STORAGE_GROUPS = "whatsapp_atak_endedGroups";
  const STORAGE_CHANNELS = "whatsapp_atak_bannedChannels";

  // --- Data Models ---
  let endedGroups = [];      // store objects: { id: string, timestamp: number, identifier: string }
  let bannedChannels = [];   // store objects: { id: string, timestamp: number, identifier: string }

  // Helper: generate unique-ish id (using timestamp + random)
  function generateEntryId() {
    return Date.now() + '-' + Math.random().toString(36).substr(2, 8);
  }

  // Load from localStorage
  function loadData() {
    const storedGroups = localStorage.getItem(STORAGE_GROUPS);
    const storedChannels = localStorage.getItem(STORAGE_CHANNELS);
    if (storedGroups) {
      try {
        endedGroups = JSON.parse(storedGroups);
      } catch(e) { endedGroups = []; }
    } else {
      endedGroups = [];
    }
    if (storedChannels) {
      try {
        bannedChannels = JSON.parse(storedChannels);
      } catch(e) { bannedChannels = []; }
    } else {
      bannedChannels = [];
    }
  }

  // Save to localStorage
  function saveGroups() {
    localStorage.setItem(STORAGE_GROUPS, JSON.stringify(endedGroups));
  }
  function saveChannels() {
    localStorage.setItem(STORAGE_CHANNELS, JSON.stringify(bannedChannels));
  }

  // Render groups list in UI
  function renderGroups() {
    const container = document.getElementById("groupListContainer");
    const groupCountSpan = document.getElementById("groupCount");
    groupCountSpan.innerText = endedGroups.length;
    if (!container) return;
    if (endedGroups.length === 0) {
      container.innerHTML = `<div class="empty-msg" style="color:#5c7f8c;text-align:center;padding:8px;"><i class="fas fa-ghost"></i> No groups ended yet.</div>`;
      return;
    }
    // sort by timestamp descending (newest first)
    const sorted = [...endedGroups].reverse();
    let html = '';
    sorted.forEach(item => {
      html += `
        <div class="item-badge group-item" data-id="${item.id}">
          <span class="item-text"><i class="fab fa-whatsapp"></i> ${escapeHtml(item.identifier)}</span>
          <button class="remove-single" data-type="group" data-uid="${item.id}"><i class="fas fa-trash-alt"></i></button>
        </div>
      `;
    });
    container.innerHTML = html;
    // attach remove events
    document.querySelectorAll('.remove-single[data-type="group"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const uid = btn.getAttribute('data-uid');
        removeGroupById(uid);
      });
    });
  }

  function renderChannels() {
    const container = document.getElementById("channelListContainer");
    const channelCountSpan = document.getElementById("channelCount");
    channelCountSpan.innerText = bannedChannels.length;
    if (!container) return;
    if (bannedChannels.length === 0) {
      container.innerHTML = `<div class="empty-msg" style="color:#5c7f8c;text-align:center;padding:8px;"><i class="fas fa-ghost"></i> No channels banned yet.</div>`;
      return;
    }
    const sorted = [...bannedChannels].reverse();
    let html = '';
    sorted.forEach(item => {
      html += `
        <div class="item-badge channel-item" data-id="${item.id}">
          <span class="item-text"><i class="fas fa-rss"></i> ${escapeHtml(item.identifier)}</span>
          <button class="remove-single" data-type="channel" data-uid="${item.id}"><i class="fas fa-minus-circle"></i></button>
        </div>
      `;
    });
    container.innerHTML = html;
    document.querySelectorAll('.remove-single[data-type="channel"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const uid = btn.getAttribute('data-uid');
        removeChannelById(uid);
      });
    });
  }

  function removeGroupById(uid) {
    endedGroups = endedGroups.filter(g => g.id !== uid);
    saveGroups();
    renderGroups();
    // optional flash effect
  }

  function removeChannelById(uid) {
    bannedChannels = bannedChannels.filter(c => c.id !== uid);
    saveChannels();
    renderChannels();
  }

  // Helper: sanitize to avoid XSS
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  // Add new ended group
  function addEndedGroup(identifierRaw) {
    let identifier = identifierRaw.trim();
    if (identifier === "") {
      alert("⚠️ Please enter a valid WhatsApp group link or identifier!");
      return false;
    }
    // check duplicate (by identifier string, but not strictly mandatory but UX)
    const exists = endedGroups.some(g => g.identifier.toLowerCase() === identifier.toLowerCase());
    if (exists) {
      alert(`❗ Group "${identifier}" is already terminated. ATAK confirmed.`);
      return false;
    }
    const newEntry = {
      id: generateEntryId(),
      identifier: identifier,
      timestamp: Date.now()
    };
    endedGroups.push(newEntry);
    saveGroups();
    renderGroups();
    // optional micro interaction: clear input
    document.getElementById("groupInput").value = "";
    // simulate "ending" effect
    simulateAtakEffect('group', identifier);
    return true;
  }

  // Add banned channel
  function addBannedChannel(identifierRaw) {
    let identifier = identifierRaw.trim();
    if (identifier === "") {
      alert("⚠️ Enter channel ID / link to execute ban!");
      return false;
    }
    const exists = bannedChannels.some(c => c.identifier.toLowerCase() === identifier.toLowerCase());
    if (exists) {
      alert(`⛔ Channel "${identifier}" is already banned. Offline.`);
      return false;
    }
    const newEntry = {
      id: generateEntryId(),
      identifier: identifier,
      timestamp: Date.now()
    };
    bannedChannels.push(newEntry);
    saveChannels();
    renderChannels();
    document.getElementById("channelInput").value = "";
    simulateAtakEffect('channel', identifier);
    return true;
  }

  // cool visual/audio-like "simulated attack" (ripple notif)
  function simulateAtakEffect(type, target) {
    // create a floating temporary toast-like message
    const msgDiv = document.createElement('div');
    msgDiv.style.position = 'fixed';
    msgDiv.style.bottom = '20px';
    msgDiv.style.left = '50%';
    msgDiv.style.transform = 'translateX(-50%)';
    msgDiv.style.backgroundColor = type === 'group' ? '#b71c1cee' : '#e65100ee';
    msgDiv.style.color = 'white';
    msgDiv.style.padding = '12px 24px';
    msgDiv.style.borderRadius = '60px';
    msgDiv.style.fontWeight = 'bold';
    msgDiv.style.backdropFilter = 'blur(10px)';
    msgDiv.style.zIndex = '9999';
    msgDiv.style.fontFamily = 'monospace';
    msgDiv.style.border = '1px solid gold';
    msgDiv.style.boxShadow = '0 0 20px rgba(0,0,0,0.7)';
    msgDiv.style.fontSize = '0.9rem';
    msgDiv.style.pointerEvents = 'none';
    if (type === 'group') {
      msgDiv.innerHTML = `<i class="fas fa-user-friends"></i> GROUP TERMINATED: ${escapeHtml(target.substring(0, 35))} ...`;
    } else {
      msgDiv.innerHTML = `<i class="fas fa-ban"></i> CHANNEL BANNED: ${escapeHtml(target.substring(0, 35))} ...`;
    }
    document.body.appendChild(msgDiv);
    setTimeout(() => {
      msgDiv.style.opacity = '0';
      msgDiv.style.transition = 'opacity 0.5s';
      setTimeout(() => {
        if(msgDiv.remove) msgDiv.remove();
      }, 600);
    }, 2000);
  }

  // Full reset all data
  function fullReset() {
    if (confirm("⚠️ FULL ATAK RESET will erase ALL terminated groups & banned channels. Continue?")) {
      endedGroups = [];
      bannedChannels = [];
      saveGroups();
      saveChannels();
      renderGroups();
      renderChannels();
      // also clear input fields optionally
      document.getElementById("groupInput").value = "";
      document.getElementById("channelInput").value = "";
      // extra flash feedback
      const flash = document.createElement('div');
      flash.innerText = "🧨 SYSTEM RESET • ALL TARGETS CLEARED 🧨";
      flash.style.position = 'fixed';
      flash.style.top = '30%';
      flash.style.left = '50%';
      flash.style.transform = 'translate(-50%, -50%)';
      flash.style.backgroundColor = 'black';
      flash.style.color = '#ffb347';
      flash.style.padding = '20px';
      flash.style.borderRadius = '30px';
      flash.style.border = '2px solid red';
      flash.style.zIndex = '9999';
      flash.style.fontWeight = 'bold';
      flash.style.fontFamily = 'monospace';
      document.body.appendChild(flash);
      setTimeout(() => {
        flash.remove();
      }, 1500);
    }
  }

  // reset groups only
  function resetGroupsOnly() {
    if (confirm("Clear ALL terminated groups? This action cannot be undone.")) {
      endedGroups = [];
      saveGroups();
      renderGroups();
    }
  }
  function resetChannelsOnly() {
    if (confirm("Clear ALL banned channels? History will vanish.")) {
      bannedChannels = [];
      saveChannels();
      renderChannels();
    }
  }

  // Event listeners + initialization 
  document.addEventListener("DOMContentLoaded", () => {
    loadData();
    renderGroups();
    renderChannels();

    // BUTTONS
    const endGroupBtn = document.getElementById("endGroupBtn");
    const banChannelBtn = document.getElementById("banChannelBtn");
    const resetGroupsBtn = document.getElementById("resetGroupsBtn");
    const resetChannelsBtn = document.getElementById("resetChannelsBtn");
    const fullResetBtn = document.getElementById("fullResetBtn");

    if (endGroupBtn) {
      endGroupBtn.addEventListener("click", () => {
        const groupVal = document.getElementById("groupInput").value;
        addEndedGroup(groupVal);
      });
    }
    if (banChannelBtn) {
      banChannelBtn.addEventListener("click", () => {
        const channelVal = document.getElementById("channelInput").value;
        addBannedChannel(channelVal);
      });
    }
    if (resetGroupsBtn) resetGroupsBtn.addEventListener("click", resetGroupsOnly);
    if (resetChannelsBtn) resetChannelsBtn.addEventListener("click", resetChannelsOnly);
    if (fullResetBtn) fullResetBtn.addEventListener("click", fullReset);

    // Optional: Enter key support
    const groupInput = document.getElementById("groupInput");
    const channelInput = document.getElementById("channelInput");
    groupInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") addEndedGroup(groupInput.value);
    });
    channelInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") addBannedChannel(channelInput.value);
    });
  });
</script>
</body>
</html>
